services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prodman-frontend
    command: npm start -- --host 0.0.0.0 --port 4200
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.angular
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - NG_CLI_ANALYTICS=false
    stdin_open: true
    tty: true
    restart: unless-stopped
